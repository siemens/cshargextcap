name: 'build and release'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Get all git tags
        run: |
          git fetch --prune --unshallow --tags --force
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install go-winres
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # pin@v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package macos packetflix-handler.app
        run: |
          cd packaging/macos/packetflix-handler
          zip  -9 -y -r -q ../../../packetflix-handler.zip packetflix-handler.app
      - name: Release packetflix-handler.zip
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # pin@v3.0.3
        with:
          files: packetflix-handler.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  archpkgbuildtest:
    runs-on: ubuntu-latest # sic!
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Get all git tags
        run: |
          git fetch --prune --unshallow --tags --force
      - name: Test packaging and testing package
        run: (cd packaging/aur && ./makepackage.sh)
