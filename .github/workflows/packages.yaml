name: 'linux packages'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  packages:
    name: Linux packages (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build snapshot packages
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # pin@v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Test package installation
        run: make -j -O dist-test
