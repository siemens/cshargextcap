name: 'build and test'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:

  buildandtest:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod
        id: go

      - name: Test Go packages
        run: go test -v -p 1 ./...

      - name: Build for Windows
        run: GOOS=windows GOARCH=amd64 go build -v ./cmd/cshargextcap

      - name: Build for Darwin
        run: GOOS=darwin GOARCH=arm64 go build -v ./cmd/cshargextcap

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tshark
        run: sudo bash .devcontainer/tshark/install.sh

      - name: Run end-to-end tests
        run: make e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint Go packages
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # pin@v9.3.0
        with:
          version: v2.15.0
