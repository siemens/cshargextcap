# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: cshargextcap
dist: ./dist

before:
  hooks:
    - go generate .
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --product-version=git-tag --file-version=git-tag --arch amd64

builds:
  - id: default
    main: ./cmd/cshargextcap
    binary: cshargextcap
    targets:
      - linux_amd64_v1
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
    tags:
      - netgo
      - osusergo
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser'

  - id: windows
    main: ./cmd/cshargextcap
    binary: cshargextcap-{{ .Arch }}-installer # play shenanigans with the build mechanism ;)
    targets:
      - windows_amd64_v1
    tags:
      - netgo
      - osusergo
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser'
    hooks:
      post:
        - cmd: packaging/windows/post.sh {{ .Path }}
          output: true

nfpms:
  - id: default
    package_name: cshargextcap
    file_name_template: '{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    vendor: Siemens
    homepage: https://github.com/siemens/cshargextcap
    maintainer: Harald Albrecht <harald.albrecht@siemens.com>
    description: |-
      ContainerShark Wireshark external capture plugin installer package.
      Capture network traffic in Docker virtual container networks.
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    ids:
      - default
    # Wireshark 4.6+ global extcap dir; older versions use the symlinked legacy dirs below.
    bindir: /usr/libexec/wireshark/extcap
    contents:
      - src: packaging/linux/com.github.siemens.packetflix.desktop
        dst: /usr/share/applications/com.github.siemens.packetflix.desktop
      - packager: apk
        src: /usr/libexec/wireshark/extcap/cshargextcap
        dst: /usr/lib/wireshark/extcap/cshargextcap
        type: symlink
      - packager: deb
        src: /usr/libexec/wireshark/extcap/cshargextcap
        dst: '/usr/lib/{{ if eq .Arch "arm64" }}aarch64{{ else }}x86_64{{ end }}-linux-gnu/wireshark/extcap/cshargextcap'
        type: symlink
      - packager: rpm
        src: /usr/libexec/wireshark/extcap/cshargextcap
        dst: /usr/lib64/wireshark/extcap/cshargextcap
        type: symlink
    scripts:
      postinstall: packaging/linux/post-install.sh
      postremove: packaging/linux/post-remove.sh
    overrides:
      apk:
        dependencies:
          - wireshark-common
          - desktop-file-utils
      deb:
        dependencies:
          - wireshark-common
          - desktop-file-utils
        recommends:
          - tshark | wireshark
      rpm:
        dependencies:
          - wireshark-cli
          - desktop-file-utils

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
